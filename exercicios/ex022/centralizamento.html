<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #container{
            background-image: url('fundos/target001.png');
            background-size: 100% 100%;
            position: relative;
            height: 96vh;
            padding: 10px;
            background-color: purple;

            #conteudo{
                background-image: url('fundos/target001.png');
            background-size: 100% 100%;
                position: absolute;/*absolute pra poder centralizar em relação ao container*/
                height: 200px;
                width: 400px;
                background-color: yellow;

                left:100%;/*posicionamento da caixa*/
                top:50%;
                transform: translate(-100%,-50%); /*mexe a posição apesar de ja ter mexido no absolute*/
            }
        }



    </style>
</head>
<body>
    <section id = "container">
        <article id="conteudo"
        ></article>
    </section>
</body>
</html>
