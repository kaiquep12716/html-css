<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="media-query.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&" />
    <title>Document</title>
</head>
<body>
    <main>
        <section id="login">
            <div id="imagem">

            </div>
            <div id="formulario">
                <h1>Login</h1>
                <p>Seja bem vindo(a) novamente. Faça login para acessar a sua conta.</p>
                <form action="login.php" method="post">
                    
                    <p id="usuario">
                        <span class="material-symbols-outlined">
                                    account_circle
                        </span>


                        <input required type="text" name="usuario" id="iusuario" minlength="5" size="10" placeholder="Seu Email">

                    </p>

                    <p id="senha">
                    
                        <span class="material-symbols-outlined">
                                        key
                        </span>

                        <input required type="password" name="senha" id="isenha"minlength="8" placeholder="Sua senha">
                    </p>

                    <p id="enviar">
                        <input type="submit" value="Entrar">
                        <br>
                        <input id="forget" type="reset" value="Esqueci a senha">
                    </p>


                </form>
            </div>

        </section>
    </main>
</body>
</html>
