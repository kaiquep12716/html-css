<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="cadastro.php" >
        
        <p>
            <label for="in1">Número 1: </label>
            <input type="number" id="in1" name="n1" required min="0" max="50"
            oninput="isoma.innerHTML = Number(in1.value) + Number(in2.value)">
        </p>
        <p>
            <label for="in2">Número 2:</label>
            <input type="number" required id="in2" name="n2" min="0" max="50" oninput="isoma.innerHTML = Number(in1.value) + Number(in2.value)" >
        </p>
        <p>
            <label for="isoma">Soma: </label>
            <output name="soma" id="isoma">0</output>
            <!--output não envia dados, apenas mostra, a soma ao clicar em enviar não será enviada usando ele-->>
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>

</body>
</html>
